# KindleRanker BR — Nginx reverse proxy
# /etc/nginx/sites-available/kindleranker
#
# Ativar:
#   ln -s /etc/nginx/sites-available/kindleranker /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# SSL (após apontar DNS):
#   certbot --nginx -d app.kindleranker.com.br -d api.kindleranker.com.br

# ── Dashboard (Next.js :3000) ──────────────────────────────────────────────────
server {
    server_name app.kindleranker.com.br;
    listen 80;

    # Logs
    access_log /var/log/nginx/kr-app.access.log;
    error_log  /var/log/nginx/kr-app.error.log;

    # Segurança básica
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # Next.js static assets com cache agressivo
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}

# ── API FastAPI (:8000) ────────────────────────────────────────────────────────
server {
    server_name api.kindleranker.com.br;
    listen 80;

    access_log /var/log/nginx/kr-api.access.log;
    error_log  /var/log/nginx/kr-api.error.log;

    # Webhook Stripe — sem buffer (raw body necessário para verificação de assinatura)
    location /stripe/webhook {
        proxy_pass              http://127.0.0.1:8000;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header        X-Forwarded-Proto $scheme;
        proxy_request_buffering off;          # CRÍTICO para Stripe
        proxy_read_timeout      30s;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;             # IA pode demorar mais
    }
}
